{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>THE ROYAL MEAL</title>
    <!-- code for font awesome cdn -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <!-- code for font awesome cdn -->

    <!-- code for linking CSS -->
    <link rel="stylesheet" href="{% static 'member1_customer/style.css' %}">
    <!-- code for linking CSS -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>

  <!-- code for header section -->
<header class="header">
     <a href="#" class="logo"><i class="fa-solid fa-bowl-food"></i>THE ROYAL MEAL</a>
     <nav class="navbar">
         <a href="{% url 'home' %}">Home</a>
         <a href="#">Our Menu</a>
           <a href="#">My Orders</a>
        </nav>

    <div class="icons">
        <div id="menu-btn" class="fas fa-bars" ></div>
        <div id="user-btn" class="fas fa-user" id="user-btn"></div> 
        <div id="search-btn" class="fas fa-search" id="search-btn"></div>  
        <div id="cart-btn" class="fas fa-shopping-cart" id="cart-btn"></div>
        <div id="login-btn" class="fas fa-sign-in-alt" id="login-btn"></div>
    </div>

    <form action="" class="search-form">
        <input type="search" name="" placeholder="Search here..." id="search-box">
        <label for="search-box" class="fas fa-search"></label>
    </form>

    <div class="shopping-cart">

    </div>

    <form action="" class="login-form">
        <h3>Login Now</h3>
        <input type="email" placeholder="your email" class="box">
        <input type="password" placeholder="your password" class="box">
        <p>Forget your password? <a href="#">Click Here</a></p>
        <input type="submit" value="Login now" class="btn">
        <p>Don't have an account? <a href="#">Create one</a></p>
    </form>

</header>
  <!-- code for header section -->
   
 <!-- code for banner section -->
  <section class="home" id="home">
    <div class="content">
     <h3>The Royal Meal</h3>
    </div>
  </section>
 <!-- code for banner section -->



<script src="{% static 'member1_customer/script.js' %}"></script>









</body>
