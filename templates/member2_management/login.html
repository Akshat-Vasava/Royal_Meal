{% extends "base.html" %}

{% block title %}Kitchen & Admin Portal{% endblock %}

{% block content %}
<div class="login-page">
    <div class="login-box">
    <h1>Kitchen & Admin Portal</h1>
    <p class="subtitle">Login with staff or manager credentials</p>
    {% if form.errors %}
    <p class="error-msg">Invalid username or password.</p>
    {% endif %}
    <form method="post">
        {% csrf_token %}
        <label for="username">Staff / Manager Username</label>
        <input type="text" id="username" name="username">

        <label for="password">Password</label>
        <input type="password" id="password" name="password">

        <button type="submit">Access Control Panel</button>
    </form>
    </div>
</div>
{% endblock %}
