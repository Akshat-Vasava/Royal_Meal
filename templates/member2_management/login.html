{% extends "base.html" %}

{% block title %}Kitchen & Admin Portal{% endblock %}

{% block content %}
<style>
    body {
        background-color: #222;
        margin: 0;
    }

    .login-box {
        width: 400px;
        min-height: 500px;
        margin: 60px auto;
        background-color: #fff;
        border: 5px solid #000;
        padding: 24px;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
        corner-radius: 8px;
    }

    .login-box h1,
    .login-box .subtitle {
        text-align: center;
    }

    .login-box label {
        display: block;
        margin-bottom: 6px;
    }

    .login-box input[type="text"],
    .login-box input[type="password"] {
        width: 100%;
        padding: 8px;
        margin-bottom: 18px;
        box-sizing: border-box;
    }

    .login-box button {
        width: 100%;
        padding: 10px;
        margin-top: 12px;
        cursor: pointer;
    }
</style>

<div class="login-box">
    <h1>Kitchen & Admin Portal</h1>
    <p class="subtitle">Login with staff or manager credentials</p>
    {% if form.errors %}
    <p style="color: red; text-align: center;">Invalid username or password.</p>
    {% endif %}
    <form method="post">
        {% csrf_token %}
        <label for="username">Staff / Manager Username</label>
        <input type="text" id="username" name="username">

        <label for="password">Password</label>
        <input type="password" id="password" name="password">

        <button type="submit">Access Control Panel</button>
    </form>
</div>
{% endblock %}
